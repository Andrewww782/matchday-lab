[theme]
primaryColor = "#0E8A5F"
font = "sans-serif"
baseRadius = "medium"

[theme.light]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6F4"
textColor = "#14201A"

[theme.dark]
backgroundColor = "#0F1512"
