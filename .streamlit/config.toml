[theme]
base = "light"
primaryColor = "#CF2B09"
backgroundColor = "#F7F6F0"
secondaryBackgroundColor = "#EFEDE4"
textColor = "#161616"
linkColor = "#A52207"
borderColor = "#16161633"
dataframeBorderColor = "#1616161F"
dataframeHeaderBackgroundColor = "#EFEDE4"
font = "'DM Sans', sans-serif"
headingFont = "'Bowlby One', sans-serif"
headingFontWeights = [400, 400, 400, 400, 400, 400]
headingFontSizes = ["3.6rem", "2.4rem", "1.9rem"]
baseRadius = "large"
buttonRadius = "0.7rem"
chartCategoricalColors = ["#CF2B09", "#161616", "#5E7F00", "#7C1A06", "#D97706", "#6B645C"]

[[theme.fontFaces]]
family = "Bowlby One"
url = "app/static/fonts/bowlby-one-normal-latin.woff2"
weight = "400"
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Yellowtail"
