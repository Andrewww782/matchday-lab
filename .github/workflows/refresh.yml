name: Weekly data refresh

on:
  schedule:
    # Tuesdays 06:00 UTC, after Monday-night games. Extra run on Fridays for team news.
    - cron: "0 6 * * 2"
    - cron: "0 6 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Cache downloads (Transfermarkt snapshot, finished seasons)
        uses: actions/cache@v5
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - run: pip install -r requirements-pipeline.txt

      - name: Rebuild data and models
        run: python -m pipeline.run_all

      - name: Check the app still works with the new data
        run: python -m pytest -q

      - name: Commit refreshed data (Streamlit Cloud redeploys on push)
        run: |
          git config user.name "matchday-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.parquet data/*.json models/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Data refresh $(date -u +%Y-%m-%d)"
          git push
