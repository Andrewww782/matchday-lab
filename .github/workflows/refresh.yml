name: Weekly data refresh

on:
  schedule:
    # Tuesdays 06:00 UTC, after Monday-night games. Extra run on Fridays for team news.
    - cron: "0 6 * * 2"
    - cron: "0 6 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write   # to open an issue (which emails you) when the refresh fails or data goes stale

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Cache downloads (Transfermarkt snapshot, finished seasons)
        uses: actions/cache@v5
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - run: pip install -r requirements-pipeline.txt

      - name: Rebuild data and models
        run: python -m pipeline.run_all

      - name: Check the app still works with the new data
        run: python -m pytest -q

      - name: Commit refreshed data (Streamlit Cloud redeploys on push)
        run: |
          git config user.name "footyminds-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.parquet data/*.json models/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Data refresh $(date -u +%Y-%m-%d)"
          git push

      - name: Flag stale sources (served from an older cached copy)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stale=$(python -c "import json; m=json.load(open('data/meta.json')); print(', '.join(m.get('stale_leagues', [])))")
          if [ -n "$stale" ]; then
            title="Data refresh used stale data: $stale"
            gh issue list --state open --search "in:title \"Data refresh used stale data\"" --json number --jq '.[0].number' | grep -q .               || gh issue create --title "$title" --body "A source failed during the refresh on $(date -u +%Y-%m-%d), so last week's copy was used for: $stale. Details in data/meta.json (stale_sources). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Open an issue if the refresh failed (the live site keeps last week's data)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --search "in:title \"Weekly refresh failed\"" --json number --jq '.[0].number' | grep -q .             || gh issue create --title "Weekly refresh failed" --body "The data refresh failed on $(date -u +%Y-%m-%d). The live site is still showing the previous data. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
